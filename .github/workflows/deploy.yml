# Builds the site with React, Tailwind and esbuild, then deploys it to GitHub Pages.
# Runs on every push to main, and can be started by hand from the Actions tab.
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the current one instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Uses the lockfile when it matches package.json (exact versions), otherwise installs from package.json.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Build
        run: npm run build

      # Layout and interaction checks on the built site (tests/webapp_test.py). A failure stops the
      # deploy; the screenshots and report are kept as a run artifact either way.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 -d dist >/dev/null 2>&1 &
          sleep 1
          python tests/webapp_test.py --base http://localhost:8000/ --out .screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: .screens
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
